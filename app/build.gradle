plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.ringerguard'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.ringerguard'
        minSdk 29
        targetSdk 34
        versionCode 5
        versionName '2.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
